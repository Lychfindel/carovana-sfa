# Per vedere il sito in locale:  docker compose up   ->  http://localhost:8088 (porta: PORTA=… nel comando)
# Immagine ufficiale PHP con il server integrato: le modifiche ai file si vedono ricaricando la pagina.
# shortcut: l'immagine non ha l'estensione GD, quindi in locale il caricamento delle foto dà errore;
# per provarlo serve un'immagine con GD (o l'hosting vero).
services:
  carovana:
    image: php:8.3-cli
    user: "${UID:-1000}:${GID:-1000}"   # così il sito può scrivere in data/
    working_dir: /app
    command: php -d upload_max_filesize=10M -d post_max_size=64M -S 0.0.0.0:8000
    ports:
      - "127.0.0.1:${PORTA:-8088}:8000"
    volumes:
      - ./:/app
    env_file:
      - path: .env      # facoltativo: password, SMTP, slogan…
        required: false
