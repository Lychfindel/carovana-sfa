<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ slogan }}{% endblock %} – Carovana</title>
  <meta name="description" content="La Carovana per i diritti dell'abitare del Social Forum dell'Abitare: iniziative in tutta Italia per discutere la proposta di legge dal basso sull'abitare. {{ slogan }}.">
  <link rel="icon" href="{{ url_for('static', filename='brand/casa.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a href="{{ url_for('home') }}" class="brand" aria-label="Carovana – {{ slogan }}">
      {% include '_casa.svg' %}
      {% include '_wordmark.svg' %}
      <span class="brand-slogan">{{ slogan }}</span>
    </a>
    <nav>
      <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>Mappa</a>
      <a href="{{ url_for('principi') }}" {% if request.endpoint == 'principi' %}aria-current="page"{% endif %}>Proposta di legge</a>
      <a href="{{ url_for('volantino') }}" {% if request.endpoint == 'volantino' %}aria-current="page"{% endif %}>Principi e linee guida</a>
      <a href="{{ url_for('proponi') }}" class="nav-cta" {% if request.endpoint == 'proponi' %}aria-current="page"{% endif %}>Proponi una tappa</a>
    </nav>
  </header>
  {% block content %}{% endblock %}


  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
